name: Build

# Builds every library of the lakefile, runs the axiom audit (part of the default
# targets) and prints the axioms of the endpoint. A newer commit on the same ref
# cancels the running build.
#
# Runs once per pushed commit. Pull requests show the checks of their head commit,
# so there is no separate pull_request run; the lead verifies the merged result
# on an integration branch before pushing to main.
on:
  push:
    branches: [main, 'line/**']
  workflow_dispatch:

permissions:
  contents: write # upload the precompiled build to the `lake-cache` release (main only)
  actions: write # replace this branch's previous build cache entry

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Disk space
        # The runner has about 88 GB free; no cleanup is needed.
        run: df -h /
      - name: Set up the pinned Lean and Mathlib environment
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Restore project build artifacts
        # One cache entry per branch (the previous one is deleted when a new one is
        # saved); a branch without its own entry starts from the newest entry of main,
        # else from the newest entry of any branch. `~` separates the branch from the
        # commit because git forbids it in branch names, so the prefix of line/R10a
        # does not match line/R10a-Inner.
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.ref_name }}~${{ github.sha }}
          restore-keys: |
            lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.ref_name }}~
            lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-main~
            lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Report which cache was restored
        run: echo "matched key = ${{ steps.restore.outputs.cache-matched-key }}"
      - name: Generate the root import
        run: python3 scripts/gen_root.py
      - name: Build every library
        shell: bash
        run: |
          set -o pipefail
          status=0
          timeout --signal=TERM --kill-after=60s 270m lake build 2>&1 | tee build.log |
            awk '/^error:|^✖/ { remaining = 60 }
              /Build completed|Some required targets logged failures|error: build failed/ || remaining > 0 {
                print; fflush(); if (remaining > 0) remaining--
              }' || status=$?
          grep -E '^(error|✖)' build.log | head -100 || true
          exit "$status"
      - name: Delete this branch's previous build cache
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.ref_name }}~
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key "$PREFIX" --limit 100 --json id --jq '.[].id' |
            while read -r id; do gh cache delete "$id" -R "$GITHUB_REPOSITORY" || true; done
      - name: Save project build artifacts
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lake-build-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.ref_name }}~${{ github.sha }}
      - name: Count compiled modules
        if: always()
        shell: bash
        run: |
          total=$(find src/ContinuousFlexibility -name '*.lean' | wc -l)
          built=$(find .lake/build/lib/lean/ContinuousFlexibility -name '*.olean' ! -name '*.server.olean' ! -name '*.private.olean' | wc -l)
          echo "modules compiled / total: $built / $total"
      - name: Blueprint status and endpoint axioms
        shell: bash
        run: |
          set -o pipefail
          lake env lean scripts/BlueprintStatus.lean 2>&1 | tee blueprint-status.log
      # Temporary metadata-only diagnostic handoff for line/N01c.
      - name: Store Lean diagnostics in a Git blob
        id: lean_diag
        if: ${{ always() && github.repository == 'Rogerhu12/continuous-flexibility' && github.ref == 'refs/heads/line/N01c' }}
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request
          from pathlib import Path
          sections = []
          build = Path("build.log")
          if build.is_file():
              selected, capture = [], False
              for line in build.read_text(encoding="utf-8", errors="replace").splitlines():
                  if line.startswith("error:"):
                      capture = True
                  elif line.startswith(("warning:", "trace:", "info:", "✔", "⚠", "✖")):
                      capture = False
                  if capture:
                      selected.append(line)
              if selected:
                  sections.append("Lean build diagnostics\n" + "\n".join(selected))
          status = Path("blueprint-status.log")
          if status.is_file():
              sections.append("Blueprint status and endpoint axioms\n" +
                  status.read_text(encoding="utf-8", errors="replace"))
          if not sections:
              sys.exit(0)
          content = "\n\n".join(sections)
          limit = 512 * 1024
          encoded = content.encode("utf-8")
          if len(encoded) > limit:
              content = encoded[:limit].decode("utf-8", errors="ignore") + "\n[Truncated at 512 KiB]\n"
          body = json.dumps({"content": content, "encoding": "utf-8"}).encode("utf-8")
          request = urllib.request.Request(
              "https://api.github.com/repos/Rogerhu12/continuous-flexibility/git/blobs",
              data=body, method="POST", headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  sha = json.load(response)["sha"]
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise ValueError("invalid blob SHA")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("sha=" + sha + "\n")
          except urllib.error.HTTPError as error:
              print("::warning::Diagnostic blob upload failed (HTTP " + str(error.code) + ").")
          except Exception:
              print("::warning::Diagnostic blob handoff failed.")
          PY
      - name: "Lean diagnostics blob ${{ steps.lean_diag.outputs.sha }}"
        if: ${{ always() && steps.lean_diag.outputs.sha != '' }}
        shell: bash
        run: ':'
      - name: Publish the precompiled build for line sandboxes
        if: github.ref == 'refs/heads/main' && success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find .lake/build/ir -name '*.setup.json' -delete 2>/dev/null || true
          tar --zstd -cf lake-build.tar.zst .lake/build
          ls -lh lake-build.tar.zst
          git rev-parse HEAD > lake-build.commit
          if gh release view lake-cache -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload lake-cache lake-build.tar.zst lake-build.commit --clobber -R "$GITHUB_REPOSITORY"
          else
            echo "::warning::release lake-cache does not exist; the compiled build was not published"
          fi
      - uses: actions/upload-artifact@v4
        # Log publishing is optional; proof validation is enforced by the build and axiom steps.
        timeout-minutes: 2
        continue-on-error: true
        if: always()
        with:
          name: build-log
          path: build.log
