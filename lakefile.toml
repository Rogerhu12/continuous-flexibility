name = "continuous_flexibility"
version = "0.1.0"
defaultTargets = ["ContinuousFlexibility", "AxiomAudit", "FlexibleSphereChallenge", "FlexibleSphereSolution"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[lean_lib]]
name = "ContinuousFlexibility"
srcDir = "src"

[[lean_lib]]
name = "AxiomAudit"
srcDir = "src"

# Statement of the main theorem with Mathlib notions only; see src/Challenge/comparator.json.
[[lean_lib]]
name = "FlexibleSphereChallenge"
srcDir = "src/Challenge"

[[lean_lib]]
name = "FlexibleSphereSolution"
srcDir = "src/Solution"
